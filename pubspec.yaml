name: fintrack
description: "FinTrack - Fast, local-first personal finance tracker."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  drift: ^2.24.2
  drift_flutter: ^0.2.4
  path_provider: ^2.1.5
  path: ^1.9.0
  go_router: ^14.8.0
  fl_chart: ^0.70.2
  intl: ^0.20.2
  uuid: ^4.5.1
  share_plus: ^10.1.4
  file_picker: ^8.3.7
  csv: ^6.0.0
  image_picker: ^1.1.2
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.3.5
  google_fonts: ^6.2.1
  flutter_native_contact_picker: ^0.0.12
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.24.2
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
